version: '3.8'

services:
  backend:
    build:
      context: ./  # Contexto de la raíz del proyecto
      dockerfile: django_crud_api/Dockerfile
    volumes:
      - ./:/app  # Monta toda la raíz del proyecto en /app
      - ./client/dist:/app/client/dist  # Montar la carpeta dist

    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DEBUG=True
      - DATABASE_URL=${DATABASE_URL}

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: db_name
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
    driver: local

